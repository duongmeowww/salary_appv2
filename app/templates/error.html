{% extends "base.html" %}
{% block title %}Lỗi {{ code }}{% endblock %}
{% block content %}
<div class="card-soft text-center py-5 px-3 my-4">
    <i class="bi bi-exclamation-triangle fs-1 text-warning"></i>
    <h1 class="display-5 fw-bold mt-3 mb-1">{{ code }}</h1>
    <p class="lead text-muted">{{ message }}</p>
    <div>
        <a class="btn btn-navy" href="{{ url_for('main.index') }}">
            <i class="bi bi-house me-1"></i>Về trang chủ
        </a>
    </div>
</div>
{% endblock %}
